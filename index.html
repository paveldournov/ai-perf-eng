<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Knowledge base: hardware, workloads, modeling, simulation, scheduling, and characterization of modern AI accelerators.">
  <meta name="color-scheme" content="dark light">
  <title>AI Performance Modeling &amp; Simulation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/pure.css">
  <style>
  /* ============================================================
     "INSTRUMENT" — site theme
     Dark-first lab console. IBM Plex Sans/Mono, teal signal accent,
     hairline rules, spec-sheet tables, tabular numerals.
     Built on docsify's minimal `pure` base; all colour lives in the
     tokens below (:root = dark, [data-theme=light] = light).
     ============================================================ */

  :root {
    --font-sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

    --bg:        #0B0E13;
    --bg-panel:  #0E1218;
    --bg-raised: #141922;
    --bg-code:   #070A0E;
    --line:      #1E2530;
    --line-soft: #171D26;
    --text:      #AFBACA;
    --text-dim:  #6E7A8A;
    --text-hi:   #E8EEF6;
    --accent:    #2DD4BF;
    --accent-dim:#1B8C80;
    --accent-2:  #7AA2F7;
    --glow:      rgba(45,212,191,.14);
    --radius: 4px;
  }
  html[data-theme="light"] {
    --bg:        #FFFFFF;
    --bg-panel:  #F7F9FB;
    --bg-raised: #F1F4F8;
    --bg-code:   #0E1218;
    --line:      #DDE3EA;
    --line-soft: #EAEFF4;
    --text:      #3B4552;
    --text-dim:  #7C8797;
    --text-hi:   #0D141C;
    --accent:    #0D9488;
    --accent-dim:#5EEAD4;
    --accent-2:  #3B5BDB;
    --glow:      rgba(13,148,136,.10);
  }

  /* Chromium keeps the old computed value of a transitioned property when the
     custom property behind it changes, so links/nav would keep their previous
     colour after a theme flip. Transitions are killed for the one frame in
     which data-theme changes (see the toggle handler). */
  html.theme-switching *,
  html.theme-switching *::before,
  html.theme-switching *::after { transition: none !important; }

  html, body { background: var(--bg); }
  body {
    font-family: var(--font-sans);
    font-size: 16px;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--glow); color: var(--text-hi); }

  /* ---------------- Sidebar ---------------- */
  /* Docsify injects the search box above the app name; flex order puts the
     title back on top where it belongs. */
  .sidebar {
    background: var(--bg-panel);
    border-right: 1px solid var(--line);
    padding: 26px 0 40px;
    width: 288px;
    display: flex; flex-direction: column;
  }
  .sidebar > .app-name { order: 1; }
  .sidebar > .search    { order: 2; }
  .sidebar > .sidebar-nav { order: 3; }
  .content, .sidebar-toggle { left: 288px; }
  .sidebar > h1 { margin: 0 22px 18px; text-align: left; }
  .sidebar > h1 .app-name-link {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -.01em;
    color: var(--text-hi);
    display: inline-flex; align-items: center; gap: 9px;
  }
  .sidebar > h1 .app-name-link::before {
    content: ""; width: 9px; height: 9px; flex: none;
    background: var(--accent); border-radius: 2px;
    box-shadow: 0 0 0 3px var(--glow);
  }

  .sidebar .search { margin: 0 16px 18px; padding: 0; border: 0; }
  .sidebar .search .input-wrap { margin: 0; }
  .sidebar .search input {
    font-family: var(--font-sans); font-size: 13.5px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 9px 11px; width: 100%; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .sidebar .search input::placeholder { color: var(--text-dim); }
  .sidebar .search input:focus { border-color: var(--accent-dim); box-shadow: 0 0 0 3px var(--glow); }
  .sidebar .search .clear-button { display: none; }

  .sidebar-nav { padding: 0 12px; }
  .sidebar-nav ul { margin: 0; padding: 0; }
  .sidebar-nav li { margin: 0; list-style: none; }
  .sidebar-nav a {
    display: block; padding: 6px 10px;
    font-size: 14px; color: var(--text); text-decoration: none;
    border-radius: var(--radius); border-left: 2px solid transparent;
    transition: color .12s, background .12s;
  }
  .sidebar-nav a:hover { color: var(--text-hi); background: var(--bg-raised); }
  .sidebar-nav li.active > a,
  .sidebar-nav a.active {
    color: var(--accent); background: var(--glow);
    border-left-color: var(--accent); font-weight: 500;
  }
  /* docsify wraps top-level items in <p>; strip its default margins */
  .sidebar-nav ul li p { margin: 0; }
  /* "Sections" group label */
  .sidebar-nav > ul > li > p > strong {
    display: block; margin: 22px 10px 7px;
    font-family: var(--font-mono); font-size: 10.5px; font-weight: 500;
    letter-spacing: .14em; text-transform: uppercase; color: var(--text-dim);
  }
  .sidebar-nav > ul > li > ul { border-left: 1px solid var(--line-soft); margin-left: 12px; }
  .sidebar-nav ul ul a { padding-left: 12px; }

  /* ---------------- Content ---------------- */
  .content { background: var(--bg); }
  .markdown-section {
    max-width: 780px;
    padding: 46px 44px 96px;
    color: var(--text);
    font-size: 16px;
    line-height: 1.72;
    overflow-wrap: break-word;
  }
  .markdown-section > *:first-child { margin-top: 0; }

  .markdown-section h1, .markdown-section h2,
  .markdown-section h3, .markdown-section h4 {
    color: var(--text-hi); font-weight: 600; letter-spacing: -.015em;
  }
  .markdown-section h1 {
    font-size: 2.05rem; line-height: 1.2; margin: 0 0 .55em;
    font-weight: 700; letter-spacing: -.028em;
  }
  .markdown-section h2 {
    font-size: 1.32rem; margin: 2.6em 0 .9em; padding-bottom: .45em;
    border-bottom: 1px solid var(--line);
  }
  .markdown-section h3 { font-size: 1.08rem; margin: 2.1em 0 .7em; }
  .markdown-section h4 {
    font-size: .82rem; margin: 1.8em 0 .6em; color: var(--text-dim);
    font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .1em;
  }
  /* Docsify wraps every heading's text in <a class="anchor"><span>. Without an
     explicit colour that <a> falls back to the browser's link colour — which
     turns every visited heading purple — and the span inherits it. Force both
     to inherit from the heading itself. */
  .markdown-section h1 .anchor, .markdown-section h2 .anchor,
  .markdown-section h3 .anchor, .markdown-section h4 .anchor,
  .markdown-section h5 .anchor, .markdown-section h6 .anchor,
  .markdown-section h1 .anchor span, .markdown-section h2 .anchor span,
  .markdown-section h3 .anchor span, .markdown-section h4 .anchor span,
  .markdown-section h5 .anchor span, .markdown-section h6 .anchor span { color: inherit; }
  .markdown-section .anchor { transition: none; }
  .markdown-section h2 .anchor::after, .markdown-section h3 .anchor::after {
    content: "#"; color: var(--accent); opacity: 0;
    margin-left: .4em; font-weight: 400; transition: opacity .15s;
  }
  .markdown-section h2:hover .anchor::after,
  .markdown-section h3:hover .anchor::after { opacity: .55; }

  .markdown-section p, .markdown-section li { color: var(--text); }
  .markdown-section strong { color: var(--text-hi); font-weight: 600; }
  .markdown-section ul, .markdown-section ol { padding-left: 1.35em; }
  .markdown-section li { margin: .38em 0; }
  .markdown-section li::marker { color: var(--text-dim); }

  .markdown-section a:not(.anchor) {
    color: var(--accent); text-decoration: none;
    border-bottom: 1px solid color-mix(in srgb, var(--accent) 32%, transparent);
    transition: border-color .15s, color .15s;
  }
  .markdown-section a:not(.anchor):hover { border-bottom-color: var(--accent); }

  /* Tables — the spec sheet.
     Wrapped in .table-wrap (see the JS below) so wide spec tables scroll
     inside their own box instead of pushing the page sideways. */
  .table-wrap { overflow-x: auto; margin: 1.7em 0; -webkit-overflow-scrolling: touch; }
  .markdown-section table {
    display: table; width: 100%; border-collapse: collapse;
    margin: 0; font-size: 14.5px;
    font-variant-numeric: tabular-nums;
    border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
  }
  .markdown-section thead { background: var(--bg-raised); }
  .markdown-section th {
    font-family: var(--font-mono); font-size: 10.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .11em; color: var(--text-dim);
    text-align: left; padding: 10px 14px; border: 0; border-bottom: 1px solid var(--line);
  }
  .markdown-section td {
    padding: 10px 14px; border: 0; border-top: 1px solid var(--line-soft);
    color: var(--text); vertical-align: top;
  }
  /* pure.css zebra-stripes even rows white (#f8f8f8), which is unreadable on a
     dark ground. Restate the striping in theme tokens instead. */
  .markdown-section tr { background: transparent; border: 0; }
  .markdown-section tbody tr:nth-child(2n) { background: var(--bg-panel); }
  .markdown-section tbody tr:hover,
  .markdown-section tbody tr:nth-child(2n):hover { background: var(--bg-raised); }
  .markdown-section td:first-child { color: var(--text-hi); font-weight: 500; }

  /* Code */
  .markdown-section code {
    font-family: var(--font-mono); font-size: .86em;
    background: var(--bg-raised); color: var(--accent);
    border: 1px solid var(--line-soft);
    padding: .12em .4em; border-radius: 3px;
  }
  .markdown-section pre {
    background: var(--bg-code); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 0; margin: 1.6em 0;
    overflow-x: auto;
  }
  .markdown-section pre::after { display: none; }
  .markdown-section pre > code {
    background: transparent; border: 0; color: #C8D0DA;
    font-size: 13.5px; line-height: 1.66; padding: 16px 18px; display: block;
  }
  .token.comment, .token.prolog, .token.doctype { color: #4E5A6B; }
  .token.string, .token.attr-value { color: #9ECE6A; }
  .token.number, .token.boolean { color: #FF9E64; }
  .token.keyword, .token.builtin { color: #BB9AF7; }
  .token.function { color: #7AA2F7; }
  .token.operator, .token.punctuation { color: #89929F; }

  /* Blockquote → callout */
  .markdown-section blockquote {
    margin: 1.6em 0; padding: 14px 18px;
    background: var(--bg-panel); border: 1px solid var(--line);
    border-left: 2px solid var(--accent); border-radius: var(--radius);
    color: var(--text);
  }
  .markdown-section blockquote p { margin: 0; }
  .markdown-section hr { border: 0; border-top: 1px solid var(--line); margin: 2.6em 0; }
  /* Pages use `---` before most H2s; the heading already carries a rule, so
     drop the redundant second line. */
  .markdown-section hr:has(+ h2) { display: none; }

  .markdown-section img, .mermaid { max-width: 100%; }
  .mermaid { text-align: center; margin: 1.8em 0; }
  .mermaid svg { max-width: 100%; height: auto; }

  /* ---------------- Right-hand TOC ----------------
     Fixed in the right gutter. The gutter is reserved by padding the
     .content column (below) so the TOC can never overlap the prose. */
  .page_toc {
    display: none;
    position: fixed; top: 72px; right: 24px; width: 200px;
    max-height: calc(100vh - 116px); overflow-y: auto;
    padding-left: 14px; border-left: 1px solid var(--line);
    font-size: 13px; z-index: 5;
  }
  @media (min-width: 1180px) {
    .page_toc { display: block; }
    .content { padding-right: 236px; }
  }
  .page_toc p.title {
    font-family: var(--font-mono); font-size: 10px; font-weight: 500;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--text-dim); margin: 0 0 10px;
  }
  .page_toc ul { list-style: none; margin: 0; padding: 0; }
  .page_toc li { margin: 0; }
  .page_toc a {
    display: block; padding: 4px 0; color: var(--text-dim);
    text-decoration: none; line-height: 1.45; transition: color .12s;
  }
  .page_toc a:hover, .page_toc a:hover span { color: var(--text-hi); }
  /* The plugin puts .active on the wrapper div, and the inner <a> sets its own
     colour — so the active rule has to reach the anchor and its <span>. */
  .page_toc .active > a,
  .page_toc .active > a span { color: var(--accent); font-weight: 500; }
  .page_toc .lv3 { padding-left: 12px; font-size: 12.5px; }

  /* ---------------- Pagination ----------------
     The plugin injects this inside .markdown-section, so it inherits the
     column width already — it only needs the rule above it. */
  .docsify-pagination-container {
    margin: 0; padding: 26px 0 0;
    border-top: 1px solid var(--line); color: var(--text-dim);
  }
  .pagination-item-label { font-family: var(--font-mono); font-size: 10.5px;
    letter-spacing: .12em; text-transform: uppercase; }
  .pagination-item-title { color: var(--text-hi); font-size: 15px; }
  .pagination-item a { color: inherit; text-decoration: none; }
  .pagination-item:hover .pagination-item-title { color: var(--accent); }

  /* ---------------- Gutter controls ----------------
     GitHub + theme toggle, sitting directly above the TOC. Replaces
     docsify's github-corner ribbon (hidden below). */
  #gutter-controls {
    position: fixed; top: 20px; right: 24px; z-index: 40;
    display: flex; gap: 8px;
  }
  #gutter-controls > * {
    width: 34px; height: 34px; display: grid; place-items: center;
    background: var(--bg-panel); color: var(--text-dim);
    border: 1px solid var(--line); border-radius: var(--radius);
    cursor: pointer; text-decoration: none;
    transition: color .15s, border-color .15s;
  }
  #gutter-controls > *:hover { color: var(--accent); border-color: var(--accent-dim); }
  #gutter-controls svg { width: 16px; height: 16px; }

  /* misc */
  .progress { background: var(--accent); height: 2px; }
  .sidebar-toggle { background: transparent; }
  .sidebar-toggle span { background: var(--accent); }
  .search .results-panel { background: var(--bg-panel); }
  .search h2, .search p { color: var(--text); }
  .search .matching-post { border-bottom: 1px solid var(--line); }
  .search a { color: var(--text-hi); }
  .search .search-keyword { color: var(--accent); background: var(--glow); }
  .github-corner { display: none; }
  @media (max-width: 768px) {
    .sidebar, .content, .sidebar-toggle { left: 0; }
    .markdown-section { padding: 32px 22px 80px; }
    #gutter-controls { top: auto; bottom: 16px; right: 16px; }
  }
  </style>
</head>
<body>
  <div id="app">Loading…</div>
  <script>
  window.$docsify = {
    name: 'AI Performance Engineering',
    repo: 'https://github.com/paveldournov/ai-perf-eng',
    homepage: 'README.md',
    // subMaxLevel is 0 because per-page headings live in the right-hand TOC.
    loadSidebar: true, subMaxLevel: 0, relativePath: true, auto2top: true, maxLevel: 4,
    // Every folder reuses the single root _sidebar.md.
    alias: { '/.*/_sidebar.md': '/_sidebar.md' },
    search: { placeholder: 'Search the knowledge base…', noData: 'No results.', depth: 4 },
    toc: { tocMaxLevel: 3, target: 'h2, h3' },
    pagination: { previousText: 'Previous', nextText: 'Next', crossChapter: true },
    markdown: { renderer: { code: function (code, lang) {
      // data-src keeps the source so the diagram can be re-rendered on theme flip.
      if (lang === 'mermaid') return '<div class="mermaid" data-src="' + encodeURIComponent(code) + '">' + code + '</div>';
      return this.origin.code.apply(this, arguments);
    }}},
    plugins: [
      // Strip YAML frontmatter so it doesn't render as raw text.
      function (hook) { hook.beforeEach(function (c) { return c.replace(/^﻿?---\r?\n[\s\S]*?\r?\n---\r?\n/, ''); }); },
      function (hook) { hook.doneEach(function () { renderMermaid(); wrapTables(); }); }
    ]
  };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-plugin-toc@1.3.1/dist/docsify-plugin-toc.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
  // ---- theme (dark default) ----
  var KEY = 'apx-theme';
  var stored = localStorage.getItem(KEY) || 'dark';
  document.documentElement.setAttribute('data-theme', stored);
  var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/></svg>';
  var GH = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.8 10.9.6.1.8-.2.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.1.1 1.7 1.2 1.7 1.2 1 1.8 2.7 1.3 3.4 1 .1-.7.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.3 1.2-3.2-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11 11 0 0 1 6 0C17.4 4.6 18.4 5 18.4 5c.6 1.6.2 2.8.1 3.1.8.9 1.2 1.9 1.2 3.2 0 4.5-2.7 5.5-5.3 5.8.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6 4.6-1.5 7.8-5.8 7.8-10.9C23.5 5.7 18.3.5 12 .5z"/></svg>';

  var controls = document.createElement('div');
  controls.id = 'gutter-controls';
  var gh = document.createElement('a');
  gh.href = 'https://github.com/paveldournov/ai-perf-eng';
  gh.target = '_blank'; gh.rel = 'noopener';
  gh.setAttribute('aria-label', 'View on GitHub');
  gh.innerHTML = GH;
  var btn = document.createElement('button');
  btn.id = 'theme-toggle'; btn.setAttribute('aria-label', 'Toggle theme');
  function paint() { btn.innerHTML = document.documentElement.getAttribute('data-theme') === 'dark' ? SUN : MOON; }
  paint();
  btn.onclick = function () {
    var root = document.documentElement;
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.classList.add('theme-switching');
    root.setAttribute('data-theme', next);
    localStorage.setItem(KEY, next);
    paint();
    void document.body.offsetHeight; // flush the restyle while transitions are off
    setTimeout(function () { root.classList.remove('theme-switching'); }, 60);
    initMermaid(); renderMermaid(true);
  };
  controls.appendChild(gh); controls.appendChild(btn);
  document.body.appendChild(controls);

  // Give every table its own horizontal scroll box; wide spec tables
  // (roofline params, chip comparisons) otherwise widen the whole page.
  function wrapTables() {
    document.querySelectorAll('.markdown-section table').forEach(function (t) {
      if (t.parentNode && t.parentNode.classList.contains('table-wrap')) return;
      var w = document.createElement('div');
      w.className = 'table-wrap';
      t.parentNode.insertBefore(w, t);
      w.appendChild(t);
    });
  }

  function initMermaid() {
    if (!window.mermaid) return;
    var d = document.documentElement.getAttribute('data-theme') === 'dark';
    window.mermaid.initialize({ startOnLoad: false, theme: d ? 'dark' : 'default' });
  }
  function renderMermaid(force) {
    if (!window.mermaid) return;
    document.querySelectorAll('.mermaid').forEach(function (el) {
      if (force && el.dataset.src) { el.removeAttribute('data-processed'); el.innerHTML = decodeURIComponent(el.dataset.src); }
    });
    try { window.mermaid.run({ querySelector: '.mermaid' }); } catch (e) {}
  }
  initMermaid();
  </script>
</body>
</html>
